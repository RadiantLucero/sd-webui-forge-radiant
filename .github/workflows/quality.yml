name: Quality checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (changed Python files)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.4

      - name: Lint changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR "$PR_BASE_SHA" "$GITHUB_SHA" -- '*.py' \
            | xargs -0 -r ruff check
